name: Auth circuit

# The BLS auth circuit had no CI (pre-soak audit C-39). Its fixtures solve in ~7.5 min and ~12 GB, so
# it runs when the circuit changes and weekly, not on every PR.
on:
  push:
    branches: [main]
    paths:
      - "auth/**"
      - ".github/workflows/auth-circuit.yml"
  pull_request:
    paths:
      - "auth/**"
      - ".github/workflows/auth-circuit.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Auth circuit — fixtures solve as expected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The pin build_circuits.sh enforces; only nargo is needed to solve witnesses.
      - name: Install nargo 1.0.0-beta.9
        run: |
          # noirup pinned to a commit (C2-3): only the nargo version was pinned before.
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/bedac8fbe6a059177c35e565f9f76db54a795976/install | bash
          "$HOME/.nargo/bin/noirup" -v 1.0.0-beta.9
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"

      - name: Compile
        working-directory: auth
        run: nargo compile

      # valid and single-signer must solve; an invalid signature and a wrong public key must not.
      - name: Fixtures
        run: bash auth/scripts/run-fixtures.sh
